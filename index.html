<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QUEENS — Digital Menu</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --cream:#FBF6EC;
    --cream-soft:#F5EFE1;
    --paper:#FFFDF9;
    --gold:#C9A227;
    --gold-deep:#9C7A17;
    --ink:#2B2420;
    --ink-soft:#000;
    --muted:#635d55;
    --line:#EDE3CE;
    --veg:#2E8B3D;
    --nonveg:#B23A2E;
    --shadow-sm: 0 2px 10px rgba(43,36,32,0.06);
    --shadow-md: 0 8px 28px rgba(43,36,32,0.10);
    --shadow-lg: 0 20px 50px rgba(43,36,32,0.16);
    --radius: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:#EDE6D6;
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  ::-webkit-scrollbar{width:0;height:0;}

  .display{ font-family:'Cormorant Garamond', serif; }

  /* ---------- App shell: centers the mobile frame on desktop ---------- */
  #app-shell{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    box-shadow:var(--shadow-lg);
    overflow-x:hidden;
  }
  @media (min-width:431px){
    body{
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:32px 16px;
      background:
        radial-gradient(circle at 20% 10%, #f3ead2 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, #efe4c9 0%, transparent 45%),
        #E7DFCB;
    }
    #app-shell{
      border-radius:34px;
      min-height:auto;
      height:874px;
      overflow-y:auto;
      border:8px solid #1c1712;
    }
  }

  .screen{ min-height:100%; padding-bottom:100px; animation:fadeSlide .38s ease; }
  @keyframes fadeSlide{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
  }

  /* ---------- Header ---------- */
  .welcome-crown img {
    width: 270px;
}
  .app-header{
    position:sticky; top:0; z-index:30;
    background:rgba(251,246,236,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 20px 14px;
  }
  .logo-row{ display:flex; align-items:center; justify-content:center; position:relative; }
  .logo-mark{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .logo-mark svg{ color:var(--gold); width:20px; height:20px; margin-bottom:2px; }
  .logo-title{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:20px; letter-spacing:3px; color:var(--ink); }
  .logo-sub{ font-size:9px; letter-spacing:4px; color:var(--gold-deep); font-weight:500; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper); border:1px solid var(--line);
    color:var(--ink); cursor:pointer; transition:transform .15s ease, background .15s ease;
    flex-shrink:0;
  }
  .icon-btn:active{ transform:scale(0.92); background:var(--cream-soft); }
  .header-left, .header-right{ position:absolute; top:50%; transform:translateY(-50%); }
  .header-left{ left:0; }
  .header-right{ right:0; }

  /* ---------- Buttons ---------- */
  .btn-gold{
    background:linear-gradient(135deg, #a1540c, #ac7528);
    color:#fff; border:none; border-radius:999px;
    padding:15px 30px; font-weight:600; font-size:14.5px; letter-spacing:.4px;
    box-shadow:0 10px 24px rgba(156,122,23,0.35);
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
  }
  .btn-gold:active{ transform:scale(0.97); }

  /* ---------- Welcome screen ---------- */
  .welcome-wrap{ min-height:100vh; display:flex; flex-direction:column; }
  .logo-mark img {
    width: 160px;
}
  .hero-photo{
    position:relative; height:52vh; min-height:380px;
    background:#000;
    overflow:hidden;
  }
  .hero-photo img{ width:100%; height:100%; object-fit:cover; opacity:.92; }
  .hero-photo::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(20,15,8,0.05) 0%, rgba(20,15,8,0.15) 55%, var(--cream) 100%);
  }
  .welcome-crown{ margin-top:34px; display:flex; justify-content:center; }
  .welcome-crown svg{ width:34px; height:34px; color:var(--gold); }
  .welcome-body{ flex:1; padding:0 28px 40px; text-align:center; margin-top:-6px; position:relative; z-index:2; }
  .welcome-name{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:34px; letter-spacing:5px; color:var(--ink); margin:6px 0 2px; }
  .welcome-sub{ font-size:11px; letter-spacing:6px; color:var(--gold-deep); font-weight:600; margin-bottom:22px; }
  .welcome-divider{ width:46px; height:2px; background:var(--gold); margin:0 auto 22px; border-radius:2px; }
  .welcome-tagline{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:22px; color:var(--ink-soft); margin-bottom:6px; }
  .welcome-line{ font-size:13px; color:var(--muted); margin-bottom:30px; }

  /* ---------- Search bar ---------- */
  .search-bar{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:12px 16px; margin:16px 20px 4px;
    box-shadow:var(--shadow-sm);
  }
  .search-bar input{
    border:none; outline:none; background:transparent; flex:1;
    font-family:'Poppins',sans-serif; font-size:14px; color:var(--ink);
  }
  .search-bar input::placeholder{ color:var(--muted); }
  .search-bar svg{ color:var(--gold-deep); flex-shrink:0; }

  /* ---------- Section titles ---------- */
  .section-pad{ padding:22px 20px 4px; }
  .eyebrow{ font-size:11px; letter-spacing:3px; color:var(--gold-deep); font-weight:600; text-transform:uppercase; }
  .section-title{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:26px; color:var(--ink); margin-top:2px; }
  .section-desc{ font-size:13px; color:var(--muted); margin-top:2px; }

  /* ---------- Hero card on Home ---------- */
  .hero-card{
    margin:16px 20px; border-radius:var(--radius); overflow:hidden;
    position:relative; box-shadow:var(--shadow-md); background:#000;
    height:190px;
  }
  .hero-card img{ width:100%; height:100%; object-fit:cover; opacity:.85; }
  .hero-card-info{
    position:absolute; left:0; right:0; bottom:0; padding:16px 18px;
    background:linear-gradient(to top, rgba(15,11,6,0.75), transparent);
    color:#fff;
  }
  .hero-card-info .tag{ font-size:10px; letter-spacing:2px; color:#F3D98A; font-weight:600; text-transform:uppercase; }
  .hero-card-info .name{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:20px; margin-top:2px; }
  .hero-card-info .note{ font-size:11px; opacity:.85; margin-top:1px; }

  /* ---------- Categories grid ---------- */
  .cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:14px 20px 6px; }
  .cat-tile{ display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .cat-tile-img{
    width:100%; aspect-ratio:1/1; border-radius:18px; overflow:hidden;
    box-shadow:var(--shadow-sm); border:1px solid var(--line); background:var(--paper);
    transition:transform .15s ease;
  }
  .cat-tile:active .cat-tile-img{ transform:scale(0.93); }
  .cat-tile-img img{ width:100%; height:100%; object-fit:cover; }
  .cat-tile-name{ font-size:11px; font-weight:500; color:var(--ink); text-align:center; line-height:1.2; }

  /* ---------- Categories list screen ---------- */
  .cat-list {
    padding: 6px 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 420px;
}
  .cat-row{
    display:flex; align-items:center; gap:14px; background:var(--paper);
    border:1px solid var(--line); border-radius:18px; padding:12px 14px;
    box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s ease;
  }
  .cat-row:active{ transform:scale(0.98); }
  .cat-row-img{ width:54px; height:54px; border-radius:14px; overflow:hidden; flex-shrink:0; background:var(--cream-soft); }
  .cat-row-img img{ width:100%; height:100%; object-fit:cover; }
  .cat-row-text{ flex:1; }
  .cat-row-text .n{ font-weight:600; font-size:15px; }
  .cat-row-text .c{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .cat-row svg.chev{ color:var(--muted); }

  /* ---------- Filter chips ---------- */
  .chip-row{ display:flex; gap:8px; padding:14px 20px 4px; overflow-x:auto; }
  .chip{
    flex-shrink:0; padding:8px 16px; border-radius:999px; font-size:12.5px; font-weight:500;
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip.active{ background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#fff; border-color:transparent; }
  .veg-dot{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  /* ---------- Menu item card ---------- */
  .item-list{ padding:10px 20px 14px; display:flex; flex-direction:column; gap:12px; }
  .item-card{
    display:flex; gap:14px; background:var(--paper); border:1px solid var(--line);
    border-radius:18px; padding:12px; box-shadow:var(--shadow-sm); cursor:pointer;
    transition:transform .15s ease;
  }
  .item-card:active{ transform:scale(0.98); }
  .item-card-img{ width:74px; height:74px; border-radius:14px; overflow:hidden; flex-shrink:0; background:var(--cream-soft); position:relative;}
  .item-card-img img{ width:100%; height:100%; object-fit:cover; }
  .item-card-body{ flex:1; min-width:0; }
  .item-top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .item-name{ font-weight:600; font-size:14.5px; color:var(--ink); }
  .item-desc{ font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item-price{ font-weight:600; font-size:13.5px; color:var(--gold-deep); margin-top:6px; font-family:'Cormorant Garamond',serif; }
  .veg-badge{ width:14px; height:14px; border:1.5px solid; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;}
  .veg-badge.veg{ border-color:var(--veg); }
  .veg-badge.nonveg{ border-color:var(--nonveg); }
  .veg-badge .dot{ width:6.5px; height:6.5px; border-radius:50%; }
  .veg-badge.veg .dot{ background:var(--veg); }
  .veg-badge.nonveg .dot{ background:var(--nonveg); }

  /* ---------- Food details screen ---------- */
  .detail-hero{ position:relative; height:320px; background:#000; }
  .detail-hero img{ width:100%; height:100%; object-fit:cover; }
  .detail-hero .top-controls{ position:absolute; top:0; left:0; right:0; padding:18px 18px 0; display:flex; justify-content:space-between; z-index:2; }
  .detail-hero .top-controls .icon-btn{ background:rgba(255,255,255,0.85); }
  .detail-sheet{
    background:var(--cream); border-radius:26px 26px 0 0; margin-top:-26px; position:relative; z-index:1;
    padding:24px 22px 30px; box-shadow:0 -10px 30px rgba(0,0,0,0.06);
  }
  .detail-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .detail-name{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:26px; color:var(--ink); }
  .detail-price{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; color:var(--gold-deep); white-space:nowrap; }
  .detail-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.65; margin-top:14px; }
  .detail-divider{ height:1px; background:var(--line); margin:20px 0; }
  .detail-block-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-deep); font-weight:600; margin-bottom:10px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag-pill{ background:var(--cream-soft); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:12px; color:var(--ink-soft); }
  .allergen-pill{ background:#FBEDEA; border:1px solid #F1CFC8; color:#9C4636; }
  .note-box{
    margin-top:24px; background:var(--paper); border:1px dashed var(--line); border-radius:16px;
    padding:14px 16px; font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:flex-start;
  }
  .note-box svg{ color:var(--gold-deep); flex-shrink:0; margin-top:1px; }

  /* ---------- Empty / loading states ---------- */
  .empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:60px 30px; color:var(--muted); }
  .empty-state svg{ color:var(--muted); margin-bottom:14px; }
  .empty-state .t{ font-weight:600; color:var(--ink); font-size:15px; margin-bottom:4px; }
  .empty-state .s{ font-size:12.5px; max-width:240px; }

  .skeleton{ background:linear-gradient(90deg, var(--cream-soft) 25%, var(--line) 37%, var(--cream-soft) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:14px; }
  @keyframes shimmer{ 0%{ background-position:100% 50%;} 100%{ background-position:0 50%; } }

  /* ---------- Bottom navigation ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    max-width:430px; margin:0 auto;
    background:rgba(251,246,236,0.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }
  #app-shell > .bottom-nav{ position:sticky; }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--muted); font-size:10.5px; font-weight:500; cursor:pointer; padding:4px 0;
    transition:color .15s ease;
  }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item.active{ color:var(--gold-deep); }
  .nav-item.active .nav-dot{ display:block; }
  .nav-dot{ display:none; width:4px; height:4px; border-radius:50%; background:var(--gold-deep); }

  /* ---------- Back button row ---------- */
  .back-row{ display:flex; align-items:center; gap:10px; }
  .header-title{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; letter-spacing:.5px; }

  /* Fade-in image */
  img.lazy-img{ opacity:0; transition:opacity .4s ease; }
  img.lazy-img.loaded{ opacity:1; }

  a{ color:inherit; text-decoration:none; }
</style>
</head>
<body>

<div id="app-shell">
  <div id="view"></div>
</div>

  name:"QUEENS",
  subtitle:"RESTAURANT",
  tagline:"Good Food • Good Mood • Great Memories",

/* ---------------- helpers ---------------- */
const inr = n => "₹" + n.toLocaleString("en-IN");
const catMeta = key => CATEGORY_META.find(c => c.key === key);
const itemsIn = key => MENU_ITEMS.filter(i => i.category === key);
const findItem = id => MENU_ITEMS.find(i => i.id === id);

function iconSvg(name, attrs=""){ return `<i data-lucide="${name}" ${attrs}></i>`; }

function vegBadge(veg){
  return `<span class="veg-badge ${veg ? 'veg' : 'nonveg'}" title="${veg ? 'Vegetarian' : 'Non-Vegetarian'}"><span class="dot"></span></span>`;
}

function lazyImg(src, alt, cls=""){
  return `<img class="lazy-img ${cls}" src="${src}" alt="${alt}" loading="lazy"
    onload="this.classList.add('loaded')"
    onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80&auto=format&fit=crop'; this.classList.add('loaded');">`;
}

function refreshIcons(){ if(window.lucide) lucide.createIcons(); }

/* ---------------- router ---------------- */
const routes = {
  "welcome": renderWelcome,
  "menu": renderHome,
  "categories": renderCategories,
};

function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  return parts;
}

function navigate(path){ location.hash = path; }

function router(){
  const parts = parseHash();
  const view = document.getElementById("view");
  window.scrollTo(0,0);
  if(document.getElementById("app-shell")) document.getElementById("app-shell").scrollTop = 0;

  if(parts.length === 0){
    view.innerHTML = renderWelcome();
  } else if(parts[0] === "menu"){
    view.innerHTML = renderHome();
  } else if(parts[0] === "categories"){
    view.innerHTML = renderCategories();
  } else if(parts[0] === "category" && parts[1]){
    view.innerHTML = renderCategory(parts[1]);
  } else if(parts[0] === "item" && parts[1]){
    view.innerHTML = renderItem(parts[1]);
  } else if(parts[0] === "search"){
    view.innerHTML = renderSearchPage();
  } else {
    view.innerHTML = renderWelcome();
  }
  refreshIcons();
  attachGlobalHandlers();
}

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

/* ---------------- shared bits ---------------- */
function bottomNav(active){
  const items = [
    { key:"menu", label:"Home", icon:"home", path:"menu" },
    { key:"search", label:"Menu", icon:"search", path:"search" },
    { key:"categories", label:"Categories", icon:"layout-grid", path:"categories" },
  ];
  return `
  <div class="bottom-nav">
    ${items.map(it => `
      <div class="nav-item ${active===it.key?'active':''}" onclick="navigate('${it.path}')">
        <span class="nav-dot"></span>
        ${iconSvg(it.icon)}
        <span>${it.label}</span>
      </div>
    `).join("")}
  </div>`;
}

function header({ back=false, title=null, showSearch=true, showMenuIcon=false } = {}){
  return `
  <div class="app-header">
    <div class="logo-row">
      <div class="header-left">
        ${back ? `<div class="icon-btn" onclick="history.back()">${iconSvg('chevron-left')}</div>`
               : showMenuIcon ? `<div class="icon-btn" onclick="navigate('categories')">${iconSvg('menu')}</div>` : ""}
      </div>
      ${title
        ? `<div class="back-row"><span class="header-title">${title}</span></div>`
        : `<div class="logo-mark">
              <img src="logo.png" alt="Queen Restaurant Logo">
           </div>`
      }
      <div class="header-right">
        ${showSearch ? `<div class="icon-btn" onclick="navigate('search')">${iconSvg('search')}</div>` : ""}
      </div>
    </div>
  </div>`;
}

function renderCategories(){
  return `

    ${header({ title:"Categories" })}

      ${CATEGORY_META.map(c => `
        <div class="cat-row" onclick="navigate('category/${c.key}')">
          <div class="cat-row-img">${lazyImg(c.image, c.name)}</div>
          <div class="cat-row-text">
            <div class="n">${c.name}</div>

        </div>
      `).join("")}

  </div>

}

function renderCategory(catKey, filter="all"){
  const meta = catMeta(catKey);
  if(!meta){
    return `<div class="screen">${header({back:true, title:"Not found"})}
      ${emptyState("compass","Category not found","Please go back and choose a category from the list.")}
    </div>${bottomNav("categories")}`;
  }
  let items = itemsIn(catKey);
  if(filter === "veg") items = items.filter(i => i.veg);
  if(filter === "nonveg") items = items.filter(i => !i.veg);

  return `
  <div class="screen">
    ${header({ back:true, title:meta.name })}
    <div class="chip-row" id="filter-chips">
      <div class="chip ${filter==='all'?'active':''}" onclick="setFilter('${catKey}','all')">All</div>
      <div class="chip ${filter==='veg'?'active':''}" onclick="setFilter('${catKey}','veg')"><span class="veg-dot" style="background:${filter==='veg' ? '#fff' : 'var(--veg)'}"></span>Veg</div>
      <div class="chip ${filter==='nonveg'?'active':''}" onclick="setFilter('${catKey}','nonveg')"><span class="veg-dot" style="background:${filter==='nonveg' ? '#fff' : 'var(--nonveg)'}"></span>Non-Veg</div>
    </div>
    <div class="item-list">
      ${items.length ? items.map(itemCard).join("") : emptyState("search-x","No items here","Try a different filter to see more dishes.")}
    </div>
  </div>
  ${bottomNav("categories")}`;
}

function itemCard(item){
  return `
  <div class="item-card" onclick="navigate('item/${item.id}')">
    <div class="item-card-img">${lazyImg(item.image, item.name)}</div>
    <div class="item-card-body">
      <div class="item-top-row">
        <div class="item-name">${item.name}</div>
        ${vegBadge(item.veg)}
      </div>
      <div class="item-desc">${item.desc}</div>
      <div class="item-price">${inr(item.price)}</div>
    </div>
  </div>`;
}

function renderItem(id){
  const item = findItem(id);
  if(!item){
    return `<div class="screen">${header({back:true, title:"Not found"})}
      ${emptyState("frown","Item not found","This dish may have moved. Go back to browse the menu.")}
    </div>`;
  }
  const meta = catMeta(item.category);
  return `
  <div class="screen" style="padding-bottom:40px;">
    <div class="detail-hero">
      ${lazyImg(item.image, item.name)}
      <div class="top-controls">
        <div class="icon-btn" onclick="history.back()">${iconSvg('chevron-left')}</div>
        ${vegBadgeLarge(item.veg)}
      </div>
    </div>
    <div class="detail-sheet">
      <div class="eyebrow">${meta ? meta.name : ""}</div>
      <div class="detail-top" style="margin-top:6px;">
        <div class="detail-name">${item.name}</div>
        <div class="detail-price">${inr(item.price)}</div>
      </div>
      <div class="detail-desc">${item.desc}</div>

      <div class="detail-divider"></div>
      <div class="detail-block-title">Ingredients</div>
      <div class="tag-row">
        ${item.ingredients.map(ing => `<span class="tag-pill">${ing}</span>`).join("")}
      </div>

      ${item.allergens && item.allergens.length ? `
      <div class="detail-divider"></div>
      <div class="detail-block-title">Allergens</div>
      <div class="tag-row">
        ${item.allergens.map(a => `<span class="tag-pill allergen-pill">${iconSvg('alert-triangle','width="12" height="12" style="margin-right:4px;vertical-align:-2px;"')}${a}</span>`).join("")}
      </div>` : ""}

      <div class="note-box">
        ${iconSvg('info', 'width="16" height="16"')}
        <span>This is a viewing-only menu. Please tell your server to place an order — ordering isn't available here.</span>
      </div>
    </div>
  </div>`;
}

function vegBadgeLarge(veg){
  return `<div class="icon-btn" title="${veg?'Vegetarian':'Non-Vegetarian'}" style="width:38px;height:38px;">
    <span class="veg-badge ${veg?'veg':'nonveg'}" style="width:16px;height:16px;"><span class="dot" style="width:8px;height:8px;"></span></span>
  </div>`;
}

function renderSearchPage(query=""){
  const q = query.trim().toLowerCase();
  const results = q
    ? MENU_ITEMS.filter(i => i.name.toLowerCase().includes(q) || (catMeta(i.category)?.name.toLowerCase().includes(q)))
    : [];

  return `
  <div class="screen">
    ${header({ back:true, title:"Search Menu", showSearch:false })}
    <div class="search-bar">
      ${iconSvg('search', 'width="18" height="18"')}
      <input id="search-input" type="text" placeholder="Search dishes or categories..." value="${query.replace(/"/g,'&quot;')}" oninput="onSearchInput(this.value)" autofocus>
      ${query ? `<span style="cursor:pointer;color:var(--muted);" onclick="onSearchInput('')">${iconSvg('x','width="16" height="16"')}</span>` : ""}
    </div>
    <div class="item-list" id="search-results">
      ${
        !q ? emptyState("search", "Search the menu", "Start typing a dish name — like “Paneer” or “Biryani” — or a category.")
        : results.length ? results.map(itemCard).join("")
        : emptyState("search-x", "No matches found", `We couldn't find anything for "${query}". Try another name or category.`)
      }
    </div>
  </div>
  ${bottomNav("search")}`;
}

function emptyState(icon, title, sub){
  return `
  <div class="empty-state">
    ${iconSvg(icon, 'width="40" height="40"')}
    <div class="t">${title}</div>
    <div class="s">${sub}</div>
  </div>`;
}

/* ---------------- interactive handlers ---------------- */
function setFilter(catKey, filter){
  document.getElementById("view").innerHTML = renderCategory(catKey, filter);
  refreshIcons();
  attachGlobalHandlers();
}

let searchDebounce;
function onSearchInput(value){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    document.getElementById("view").innerHTML = renderSearchPage(value);
    refreshIcons();
    attachGlobalHandlers();
    const input = document.getElementById("search-input");
    if(input){ input.focus(); input.setSelectionRange(value.length, value.length); }
  }, 120);
}

function attachGlobalHandlers(){
  // placeholder for any future delegated listeners
}
</script>
